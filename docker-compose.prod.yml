version: '3.8'

# 線上版 Docker Compose 配置
# 使用外部服務：Neon PostgreSQL + Upstash Redis

services:
  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    container_name: twstock-api-prod
    restart: unless-stopped
    environment:
      # 資料庫（Neon PostgreSQL）
      DATABASE_URL: ${DATABASE_URL}

      # Redis（Upstash Redis）
      REDIS_URL: ${REDIS_URL}

      # CORS 設定
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}

      # 效能設定
      MAX_WORKERS: ${MAX_WORKERS:-20}
      MAX_API_WORKERS: ${MAX_API_WORKERS:-10}
      MAX_CONCENTRATION_WORKERS: ${MAX_CONCENTRATION_WORKERS:-10}
      ENABLE_CONCENTRATION: ${ENABLE_CONCENTRATION:-true}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}

      # 身份驗證（可選）
      REQUIRE_AUTH: ${REQUIRE_AUTH:-false}
      ALLOWED_EMAILS: ${ALLOWED_EMAILS:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}

      # 資料保留策略（線上版保留 250 個交易日）
      ENVIRONMENT: production
      DATA_RETENTION_DAYS: 250
      CLEANUP_VACUUM: true

      # API 設定
      API_TITLE: TW Stock Chip Dashboard API
      API_VERSION: 1.0.0
      DEBUG: false
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
        VITE_REQUIRE_AUTH: ${VITE_REQUIRE_AUTH:-false}
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
    container_name: twstock-frontend-prod
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
